<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Company Login • Orion</title>

    <link
        rel="stylesheet"
        href="auth.css"
    >

</head>

<body class="auth-page">

<a href="../landing.html" class="back-home">
    ← Back to Orion
</a>

<div class="auth-container">

    <a
        href="../landing.html"
        class="auth-logo"
    >

        <div class="brand-mark">

            <span></span>
            <span></span>

        </div>

        orion

    </a>



    <div class="auth-card">

        <div class="auth-header">

            <p class="eyebrow">
                COMPANY LOGIN
            </p>

            <h1>
                Welcome back
            </h1>

            <p>
                Log in to manage your organization.
            </p>

        </div>



        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="password"
                required
            >


            <button
                type="submit"
                class="button button-dark full-width"
            >
                Log In
            </button>

            <p
                id="loginError"
                class="form-error"
            ></p>

        </form>



        <p class="auth-footer">

            Don't have a company account?

            <a href="company-signup.html">

                Create one

            </a>

        </p>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../supabase-config.js"></script>

<script src="company-login.js"></script>

</body>
</html>
