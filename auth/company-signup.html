<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Company Account • Orion</title>

    <link
        rel="stylesheet"
        href="auth.css"
    >

</head>

<body class="auth-page">

<a href="../landing.html" class="back-home">
    ← Back to Orion
</a>

<div class="auth-container">

    <a
        href="../landing.html"
        class="auth-logo"
    >

        <span class="site-logo-frame"><img class="site-logo-image" src="../logo.png" alt="ORION logo"></span>

        orion

    </a>


    <div class="auth-card">

        <div class="auth-header">

            <p class="eyebrow">
                COMPANY ACCOUNT
            </p>

            <h1>
                Create your company workspace
            </h1>

            <p>
                Set up Orion for your organization.
            </p>

        </div>


        <form id="signupForm">

            <label>Company Name</label>

            <input
                type="text"
                id="companyName"
                placeholder="Acme Technologies"
                required
            >


            <label>Industry</label>

            <input
                type="text"
                id="industry"
                placeholder="Software"
                required
            >


            <label>Company Size</label>

            <select id="companySize" required>

                <option value="">Select</option>

                <option>1-10</option>

                <option>11-50</option>

                <option>51-200</option>

                <option>201-500</option>

                <option>500+</option>

            </select>


            <label>Website</label>

            <input
                type="url"
                id="website"
                placeholder="https://company.com"
            >


            <label>Administrator Name</label>

            <input
                type="text"
                id="adminName"
                required
            >


            <label>Work Email</label>

            <input
                type="email"
                id="email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="password"
                minlength="8"
                required
            >


            <button
                class="button button-dark full-width"
                type="submit"
            >
                Create Company
            </button>

            <p
                class="form-error"
                id="signupError"
            ></p>

        </form>



        <div
            class="verification-message"
            id="verificationMessage"
        >

            <div class="success-icon">
                ✓
            </div>

            <h2>
                Verify your email
            </h2>

            <p>

                We've sent a verification link to

                <strong id="verificationEmail"></strong>

            </p>

            <a
                href="company-login.html"
                class="button button-dark full-width"
            >
                Go to Login
            </a>

        </div>



        <p class="auth-footer">

            Already have a company account?

            <a href="company-login.html">
                Log in
            </a>

        </p>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../supabase-config.js"></script>

<script src="company-signup.js"></script>

</body>
</html>
